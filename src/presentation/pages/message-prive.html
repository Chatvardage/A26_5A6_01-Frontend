<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatVardage — Messages privés</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/message-prive.css" />
  </head>
  <body>
    <nav id="server-rail" aria-label="Navigation principale">
      <img class="app-logo" src="../../../assets/icon.png" alt="ChatVardage" />
      <div class="rail-divider"></div>
      <button class="server-icon" title="Projet" aria-label="Serveur : Projet">P</button>
      <button class="server-icon" title="Ajouter un serveur" aria-label="Ajouter un serveur">+</button>
    </nav>

    <aside id="dm-sidebar">
      <div class="sidebar-header">Messages privés</div>
      <div class="friends-actions">
        <button>En ligne</button>
        <button class="active">Tous</button>
        <button>Demandes</button>
      </div>
      <ul id="conversation-list">
      </ul>
    </aside>

    <main id="main">
      <header id="topbar">
        <div class="dm-user">
          <div class="avatar"></div>
          <div>
            <div class="user-name">Alexandre</div>
            <div class="user-status">En ligne</div>
          </div>
        </div>
      </header>

      <div id="message-list" aria-live="polite">
        <article class="message-row">
          <div class="avatar"></div>
          <div class="message-body">
            <div class="message-meta">
              <span class="author">Alexandre</span>
              <span class="timestamp">13:02</span>
            </div>
            <p class="text">Salut, est-ce que ton interface DM est prête ?</p>
          </div>
        </article>
        <article class="message-row own-message">
          <div class="avatar offline"></div>
          <div class="message-body">
            <div class="message-meta">
              <span class="author">Moi</span>
              <span class="timestamp">13:03</span>
            </div>
            <p class="text">Oui, j'ai reproduit le style Discord avec notre thème.</p>
          </div>
        </article>
      </div>

      <div id="typing-indicator">Alexandre est en train d'écrire...</div>

      <div id="composer">
        <form id="message-form">
          <input
            id="message-input"
            type="text"
            placeholder="Envoyer un message à @Alexandre"
            autocomplete="off"
          />
          <button type="submit">Envoyer</button>
        </form>
      </div>
    </main>
    <script src="javascript/message-prive.js"></script>
  </body>
</html>
