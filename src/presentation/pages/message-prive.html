<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatVardage — Messages privés</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/message-prive.css" />
  </head>
  <body>
    <nav id="server-rail" aria-label="Navigation principale">
      <img class="app-logo" src="../../../assets/icon.png" alt="ChatVardage" />
      <div class="rail-divider"></div>
      <button class="server-icon" title="Projet" aria-label="Serveur : Projet">P</button>
      <button class="server-icon" title="Ajouter un serveur" aria-label="Ajouter un serveur">+</button>
    </nav>

    <aside id="dm-sidebar">
      <div class="sidebar-header">Messages privés</div>
      <div class="friends-actions" aria-label="Filtres des messages privés">
        <button type="button" class="filter-button active" data-filter="all">Tous</button>
        <button type="button" class="filter-button" data-filter="online">En ligne</button>
      </div>
      <ul id="conversation-list" aria-label="Liste des conversations privées"></ul>
      <div id="user-panel">
        <div class="avatar"></div>
        <div>
          <select id="current-user-select" aria-label="Utilisateur simulé"></select>
          <div class="presence-label" id="current-user-presence">En ligne</div>
        </div>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <div class="dm-user">
          <div class="avatar topbar-avatar"></div>
          <div>
            <div class="user-name">Sélectionnez une conversation</div>
            <div class="user-status">Aucune conversation active</div>
          </div>
        </div>
      </header>

      <div id="message-list" aria-live="polite">
        <article class="message-row">
          <div class="message-body">
            <p class="text">Aucune conversation sélectionnée.</p>
          </div>
        </article>
      </div>

      <div id="typing-indicator">Aucune activité</div>

      <div id="composer">
        <form id="message-form">
          <input
            id="message-input"
            type="text"
            placeholder="Écrire un message privé"
            autocomplete="off"
          />
          <button type="submit">Envoyer</button>
        </form>
      </div>
    </main>
    <script type="module" src="javascript/message-prive.js"></script>
  </body>
</html>
