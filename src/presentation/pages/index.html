<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatVardage</title>
    <link rel="stylesheet" href="css/styles.css" />
    <!-- Chargé AVANT le premier rendu : applique le thème mémorisé (voir
         theme-browser.js), sinon flash du thème sombre à la navigation. -->
    <script src="javascript/theme-browser.js"></script>
  </head>
  <body>
    <nav
      id="server-rail"
      aria-label="Serveurs"
      data-i18n-aria-label="nav.servers"
    >
      <button id="message-prive-btn">
        <img
          class="app-logo"
          src="../../../assets/icon.png"
          alt="ChatVardage"
        />
        <span class="notif-dot notif-dot--rail" hidden></span>
      </button>
      <div class="rail-divider"></div>
      <!-- Icônes des serveurs insérées ici par le JS
           (ChatUiShared.afficherRailServeurs), avant le « + ». -->
      <button
        id="open-create-channel-rail"
        class="server-icon server-icon--add"
        title="Ajouter un serveur"
        aria-label="Ajouter un serveur"
        data-i18n-title="servers.addTitle"
        data-i18n-aria-label="servers.addTitle"
      >
        +
      </button>
    </nav>

    <aside id="channel-sidebar">
      <div class="sidebar-header">
        <!-- Nom du serveur actif : ouvre son menu (paramètres, inviter,
             quitter, supprimer selon le rôle). -->
        <button
          id="server-menu-btn"
          class="server-menu-btn"
          type="button"
          disabled
          title="Menu du serveur"
          data-i18n-title="servers.menu"
        >
          <span id="server-name"></span>
          <span class="server-menu-chevron" aria-hidden="true">▾</span>
        </button>
        <button
          id="open-create-channel"
          class="icon-action"
          hidden
          title="Créer un salon"
          data-i18n-title="nav.createChannel"
        >
          +
        </button>
      </div>
      <ul id="channel-list"></ul>
      <button id="open-invitations" class="sidebar-action">
        <span data-i18n="nav.invitations">Invitations</span>
        <span id="invitation-count" class="badge" hidden>0</span>
      </button>
      <div id="user-panel">
        <!-- Photo (ou initiale) + pastille de présence : voir
             ChatUiShared.afficherAvatarCourant. -->
        <div id="current-user-avatar" class="avatar user-avatar"></div>
        <div class="user-info">
          <div class="current-user-row">
            <span id="current-user-pseudo" class="current-user-pseudo"></span>
            <span id="current-user-role-badge" class="role-badge" hidden></span>
          </div>
        </div>
        <button
          id="open-profile"
          class="notif-settings-btn"
          type="button"
          title="Profil"
          aria-label="Profil"
          data-i18n-title="nav.profile"
          data-i18n-aria-label="nav.profile"
        >
          <svg
            viewBox="0 0 16 16"
            width="16"
            height="16"
            aria-hidden="true"
            focusable="false"
          >
            <circle cx="8" cy="5.5" r="2.6" fill="currentColor" />
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              d="M2.6 14c.5-3 2.9-5 5.4-5s4.9 2 5.4 5"
            />
          </svg>
        </button>
        <button
          id="logout-btn"
          class="notif-settings-btn"
          type="button"
          title="Se déconnecter"
          aria-label="Se déconnecter"
          data-i18n-title="nav.logout"
          data-i18n-aria-label="nav.logout"
        >
          <svg
            viewBox="0 0 16 16"
            width="16"
            height="16"
            aria-hidden="true"
            focusable="false"
          >
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6.3 2.5H3.4a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1H6.3"
            />
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9.8 5.2 12.9 8l-3.1 2.8M12.6 8H5.9"
            />
          </svg>
        </button>
        <button
          id="open-notif-settings"
          class="notif-settings-btn"
          type="button"
          title="Notifications"
          aria-label="Paramètres de notifications"
          aria-haspopup="true"
          aria-expanded="false"
          data-i18n-title="notifications.title"
          data-i18n-aria-label="notifications.settingsAriaLabel"
        >
          <svg
            viewBox="0 0 16 16"
            width="16"
            height="16"
            aria-hidden="true"
            focusable="false"
          >
            <path
              fill="currentColor"
              d="M8 1.4c-.6 0-1.05.47-1.05 1.05v.57C4.83 3.55 3.4 5.5 3.4 7.65v2.5L2.1 11.9c-.32.4-.03.98.48.98h10.84c.51 0 .8-.58.48-.98l-1.3-1.75v-2.5c0-2.15-1.43-4.1-3.55-4.63v-.57C9.05 1.87 8.6 1.4 8 1.4Z"
            />
            <path fill="currentColor" d="M6.2 13.4a1.8 1.8 0 0 0 3.6 0Z" />
          </svg>
        </button>
        <div
          id="notif-menu"
          class="notif-menu"
          hidden
          role="menu"
          aria-label="Préférences de notification"
          data-i18n-aria-label="notifications.menuAriaLabel"
        >
          <p class="notif-menu-title" data-i18n="notifications.title">
            Notifications
          </p>
          <label class="notif-menu-option">
            <input type="radio" name="notif-mode" value="systeme" />
            <span class="notif-menu-option-text">
              <span
                class="notif-menu-option-title"
                data-i18n="notifications.systemTitle"
                >Système + son</span
              >
              <span
                class="notif-menu-option-desc"
                data-i18n="notifications.systemDesc"
                >Notification Windows avec son, et un rond sur la
                conversation</span
              >
            </span>
          </label>
          <label class="notif-menu-option">
            <input type="radio" name="notif-mode" value="discret" />
            <span class="notif-menu-option-text">
              <span
                class="notif-menu-option-title"
                data-i18n="notifications.discreteTitle"
                >Discret</span
              >
              <span
                class="notif-menu-option-desc"
                data-i18n="notifications.discreteDesc"
                >Un rond sur la conversation, rien d'autre</span
              >
            </span>
          </label>
          <label class="notif-menu-option">
            <input type="radio" name="notif-mode" value="aucune" />
            <span class="notif-menu-option-text">
              <span
                class="notif-menu-option-title"
                data-i18n="notifications.noneTitle"
                >Aucune</span
              >
              <span
                class="notif-menu-option-desc"
                data-i18n="notifications.noneDesc"
                >Pas de notification</span
              >
            </span>
          </label>
          <label class="notif-menu-option notif-menu-option--case">
            <input type="checkbox" id="notif-apercu" />
            <span class="notif-menu-option-text">
              <span
                class="notif-menu-option-title"
                data-i18n="notifications.previewTitle"
                >Afficher le contenu</span
              >
              <span
                class="notif-menu-option-desc"
                data-i18n="notifications.previewDesc"
                >Le texte du message apparaît dans la notification système,
                même sur un écran verrouillé</span
              >
            </span>
          </label>
        </div>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <div class="channel-name">
          <span id="active-channel-name"></span>
          <span
            id="private-indicator"
            class="private-indicator"
            hidden
            data-i18n="channels.private"
            >Privé</span
          >
          <button
            id="open-room-settings"
            class="icon-action"
            type="button"
            hidden
            title="Paramètres du salon"
            aria-label="Paramètres du salon"
            data-i18n-title="roomSettings.title"
            data-i18n-aria-label="roomSettings.title"
          >
            ⚙
          </button>
        </div>
        <div class="topbar-actions">
          <button
            id="open-members"
            class="network-test-button"
            disabled
            data-i18n="channels.members"
          >
            Membres
          </button>
          <button
            id="open-invite-user"
            class="primary-button"
            hidden
            data-i18n="channels.invite"
          >
            Inviter
          </button>
          <div
            id="connection-status"
            class="connection-status"
            data-state="inconnu"
            role="status"
            aria-live="polite"
          >
            <span class="dot" aria-hidden="true"></span>
            <span class="connection-text">
              <span id="connection-label"></span>
              <span id="connection-detail" class="connection-detail" hidden></span>
            </span>
            <button
              id="connection-retry"
              class="connection-retry"
              type="button"
              data-i18n="network.retryNow"
              hidden
            >
              Réessayer
            </button>
          </div>
        </div>
      </header>

      <div id="message-list" aria-live="polite"></div>

      <div
        id="typing-indicator"
        class="typing-indicator"
        aria-live="polite"
        hidden
      >
        <span class="typing-dots" aria-hidden="true">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </span>
        <span id="typing-text" class="typing-text"
          ><strong id="is-typing-nom"></strong
          ><span data-i18n="typing.suffix">
            est en train d'écrire...</span
          ></span
        >
      </div>

      <div id="composer">
        <form id="message-form">
          <input
            id="message-input"
            type="text"
            placeholder="Envoyez un message dans #général"
            autocomplete="off"
            maxlength="2000"
          />
          <button type="submit" data-i18n="channels.send">Envoyer</button>
        </form>
      </div>
    </main>

    <dialog id="app-dialog">
      <form method="dialog" id="dialog-form">
        <div class="dialog-header">
          <h2 id="dialog-title"></h2>
          <button
            value="cancel"
            formnovalidate
            class="close-button"
            aria-label="Fermer"
            data-i18n-aria-label="channels.close"
          >
            ×
          </button>
        </div>
        <div id="dialog-content"></div>
      </form>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="javascript/notif-prefs.js"></script>
    <script src="javascript/i18n-browser.js"></script>
    <script src="javascript/chat-ui-shared.js"></script>
    <script src="javascript/logique-interface.js"></script>
    <!-- Page des salons : scripts classiques, dans CET ordre (voir l'en-tête
         de javascript/salons/etat.js) ; renderer.js la démarre, en dernier. -->
    <script src="javascript/salons/etat.js"></script>
    <script src="javascript/salons/historique.js"></script>
    <script src="javascript/salons/affichage.js"></script>
    <script src="javascript/salons/dialogues.js"></script>
    <script src="javascript/salons/session.js"></script>
    <script src="javascript/salons/temps-reel.js"></script>
    <script src="../../../renderer.js"></script>
  </body>
</html>
