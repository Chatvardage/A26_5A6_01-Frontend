<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatvardage</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
          Arial, sans-serif;
        margin: 0;
        padding: 2rem;
        background-color: #1e1e2e;
        color: #cdd6f4;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
      }
      .card {
        background: #313244;
        padding: 1.5rem 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        max-width: 400px;
        width: 100%;
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
        color: #cba6f7;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 1rem 0;
      }
      li {
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
      }
      span {
        font-weight: bold;
        color: #89b4fa;
      }
      button {
        background-color: #89b4fa;
        color: #11111b;
        border: none;
        padding: 0.6rem 1.2rem;
        border-radius: 4px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
      }
      button:hover {
        background-color: #b4befe;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello, Electron!</h1>
      <ul>
        <li>Node: <span id="node-ver">-</span></li>
        <li>Chrome: <span id="chrome-ver">-</span></li>
        <li>Electron: <span id="electron-ver">-</span></li>
      </ul>
      <button id="ping-btn">Ping Main Process</button>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
